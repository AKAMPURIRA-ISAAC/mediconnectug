services:
  - type: web
    name: mediconnectug-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        sync: false          # You will paste this in Render dashboard
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a secure random value

