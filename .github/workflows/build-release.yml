name: Build & Release APK

on:
  push:
    tags:
      - 'v*'          # triggers on version tags like v1.0.0, v1.1.0
  workflow_dispatch:  # allows manual trigger from GitHub Actions tab

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create GitHub Releases

    steps:
      # ── 1. Checkout code ─────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Java 17 ────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Cache Gradle ──────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts') }}

      # ── 4. Build debug APK (no keystore needed) ───────────────
      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # ── 5. Rename APK with version tag ───────────────────────
      - name: Rename APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/MediConnectUG-${{ github.ref_name }}.apk

      # ── 6. Upload APK as build artifact ──────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediConnectUG-APK
          path: release/MediConnectUG-*.apk
          retention-days: 30

      # ── 7. Create GitHub Release with APK attached ───────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "MediConnectUG ${{ github.ref_name }}"
          body: |
            ## 📱 MediConnectUG ${{ github.ref_name }}

            ### How to Install
            1. Download **MediConnectUG-${{ github.ref_name }}.apk** below
            2. On your Android phone: **Settings → Security → Allow unknown sources**
            3. Open the downloaded APK file and tap **Install**
            4. Open the app and create your account!

            ### Features
            - 🩺 AI symptom checker & health triage
            - 👨‍⚕️ Connect with verified Ugandan doctors
            - 📅 Book appointments instantly
            - 🚨 Emergency calling
            - 💊 Prescription & medication tracking

            > **Requirements:** Android 7.0 (API 24) or higher
          files: release/MediConnectUG-*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
