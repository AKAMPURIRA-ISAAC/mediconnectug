name: Build & Release APK

on:
  push:
    tags:
      - 'v*'          # triggers on version tags like v1.0.0, v1.1.0
  workflow_dispatch:  # allows manual trigger from GitHub Actions tab

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ─────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Java 17 ────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Cache Gradle ──────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts') }}

      # ── 4. Decode keystore from GitHub secret ────────────────
      - name: Decode keystore
        run: |
          mkdir -p app/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore/mediconnectug.jks

      # ── 5. Build signed release APK ──────────────────────────
      - name: Build Release APK
        env:
          KEYSTORE_FILE: keystore/mediconnectug.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # ── 6. Rename APK with version ───────────────────────────
      - name: Rename APK
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | grep -oP '"\K[^"]+')
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/MediConnectUG-v${VERSION}.apk

      # ── 7. Upload APK as build artifact ──────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediConnectUG-APK
          path: app/build/outputs/apk/release/MediConnectUG-*.apk
          retention-days: 30

      # ── 8. Create GitHub Release with APK attached ───────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "MediConnectUG ${{ github.ref_name }}"
          body: |
            ## 📱 MediConnectUG ${{ github.ref_name }}

            ### How to Install
            1. Download **MediConnectUG-${{ github.ref_name }}.apk** below
            2. On your Android phone: **Settings → Security → Allow unknown sources**
            3. Open the downloaded APK file and tap **Install**

            ### What's New
            - See commit history for changes

            ### Requirements
            - Android 7.0 (API 24) or higher
          files: app/build/outputs/apk/release/MediConnectUG-*.apk
          draft: false
          prerelease: false

